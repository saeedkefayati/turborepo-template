glob_matcher: doublestar

pre-commit:
  jobs:
    - name: quality
      group:
        piped: true
        jobs:
          - name: branch
            run: pnpm branch:validate

          - name: prettier
            run: pnpm exec prettier --write {staged_files}
            glob:
              - "**/*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,css,md,yml,yaml}"
            stage_fixed: true

          - name: remark
            root: apps/docs
            run: pnpm exec remark --output --quiet {staged_files} && pnpm exec remark --no-stdout --frail {staged_files}
            glob:
              - "apps/docs/content/**/*.mdx"
            stage_fixed: true

          - name: eslint
            run: pnpm exec eslint --flag v10_config_lookup_from_file --fix {staged_files}
            glob:
              - "**/*.{js,jsx,ts,tsx,mjs,cjs}"
            stage_fixed: true

          - name: validation
            group:
              parallel: true
              jobs:
                - name: types
                  run: pnpm check-types

                - name: ui-tests
                  glob:
                    - "packages/ui/**/*.{ts,tsx,css,json}"
                  run: pnpm --filter @repo/ui test

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: branch
      run: node scripts/git/validate-branch.mjs --stdin
      use_stdin: true

    - name: validation
      group:
        parallel: true
        jobs:
          - name: format
            run: pnpm format:check

          - name: lint
            run: pnpm lint

          - name: types
            run: pnpm check-types

          - name: tests
            run: pnpm test

          - name: build
            run: pnpm build
