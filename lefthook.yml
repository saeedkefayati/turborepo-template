glob_matcher: doublestar

pre-commit:
  jobs:
    - name: quality
      group:
        piped: true
        jobs:
          - name: prettier
            run: pnpm exec prettier --write {staged_files}
            glob:
              - "*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,css,md,yml,yaml}"
            stage_fixed: true

          - name: eslint
            run: pnpm exec eslint --flag v10_config_lookup_from_file --fix {staged_files}
            glob:
              - "*.{js,jsx,ts,tsx,mjs,cjs}"
            stage_fixed: true

          - name: validation
            group:
              parallel: true
              jobs:
                - name: types
                  run: pnpm check-types

                - name: ui-tests
                  glob:
                    - "packages/ui/**/*.{ts,tsx,css,json}"
                  run: pnpm --filter @repo/ui test-storybook

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: true

  jobs:
    - name: format
      run: pnpm format:check

    - name: lint
      run: pnpm lint

    - name: types
      run: pnpm check-types

    - name: ui-tests
      run: pnpm --filter @repo/ui test-storybook

    - name: storybook-build
      run: pnpm --filter @repo/ui build-storybook
