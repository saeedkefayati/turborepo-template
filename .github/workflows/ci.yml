name: CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  native:
    name: Native / ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04

          - name: Linux ARM64
            os: ubuntu-24.04-arm

          - name: macOS ARM64
            os: macos-26

          - name: Windows x64
            os: windows-2025

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.8.5"
          cache: true

      - name: Show toolchain versions
        run: |
          mise --version
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm check-types

      - name: Build
        run: pnpm build

  windows-arm64:
    name: Preview / Windows ARM64

    runs-on: windows-11-arm
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.8.5"
          cache: true

      - name: Show toolchain versions
        run: |
          mise --version
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm check-types

      - name: Build
        run: pnpm build

  ui-browser:
    name: UI / Storybook Chromium

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.8.5"
          cache: true

      - name: Show toolchain versions
        run: |
          mise --version
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @repo/ui exec playwright install --with-deps chromium

      - name: Run Storybook tests
        run: pnpm --filter @repo/ui test-storybook

      - name: Build Storybook
        run: pnpm --filter @repo/ui build-storybook

  ci-gate:
    name: CI Gate

    if: ${{ always() }}
    needs:
      - native
      - ui-browser

    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Verify required jobs
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
          UI_BROWSER_RESULT: ${{ needs.ui-browser.result }}
        run: |
          echo "Native result: $NATIVE_RESULT"
          echo "UI browser result: $UI_BROWSER_RESULT"

          if [ "$NATIVE_RESULT" != "success" ]; then
            echo "Required native CI jobs failed."
            exit 1
          fi

          if [ "$UI_BROWSER_RESULT" != "success" ]; then
            echo "Required UI browser CI job failed."
            exit 1
          fi
